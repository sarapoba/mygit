<title>루트(ROOT) 코어 루프 프로토타입 v0.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  /* ── 앱 팔레트 (14 문서 토큰) ───────────────────────────── */
  :root{
    --bg:#F7F9F6; --card:#FFFFFF; --line:#E4EAE4; --ink:#1B2A21; --sub:#51625A; --mut:#8B9A92;
    --leaf:#3D9A5C; --leaf-d:#2E7D4A; --leaf-050:#F1F7F2; --leaf-100:#DEEEE1;
    --ice:#4E9CD0; --ice-100:#E3F2FB; --amber:#DE9B3B; --amber-100:#FBF0DC; --plum:#8B6FC7;
    --g0:#EDF0EC; --g1:#C7E5CC; --g2:#7CC98F; --g3:#3D9A5C;
    --shadow:0 10px 30px rgba(15,30,20,.10);
    --shadow-card:0 6px 18px rgba(27,42,33,.06);
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0F1722; --card:#18232F; --line:#243140; --ink:#E8F0EA; --sub:#9FB0A6; --mut:#5F7069;
    --leaf:#4FB874; --leaf-d:#3D9A5C; --leaf-050:#16241C; --leaf-100:#1E3527;
    --ice:#6FB6E4; --ice-100:#16283B; --amber:#E4AC58; --amber-100:#2E2617; --plum:#A48BE0;
    --g0:#1C2833; --g1:#28513A; --g2:#35784E; --g3:#4FB874; --shadow:0 10px 30px rgba(0,0,0,.35);
    --shadow-card:none;
  }}
  :root[data-theme="dark"]{
    --bg:#0F1722; --card:#18232F; --line:#243140; --ink:#E8F0EA; --sub:#9FB0A6; --mut:#5F7069;
    --leaf:#4FB874; --leaf-d:#3D9A5C; --leaf-050:#16241C; --leaf-100:#1E3527;
    --ice:#6FB6E4; --ice-100:#16283B; --amber:#E4AC58; --amber-100:#2E2617; --plum:#A48BE0;
    --g0:#1C2833; --g1:#28513A; --g2:#35784E; --g3:#4FB874; --shadow:0 10px 30px rgba(0,0,0,.35);
    --shadow-card:none;
  }
  :root[data-theme="light"]{
    --bg:#F7F9F6; --card:#FFFFFF; --line:#E4EAE4; --ink:#1B2A21; --sub:#51625A; --mut:#8B9A92;
    --leaf:#3D9A5C; --leaf-d:#2E7D4A; --leaf-050:#F1F7F2; --leaf-100:#DEEEE1;
    --ice:#4E9CD0; --ice-100:#E3F2FB; --amber:#DE9B3B; --amber-100:#FBF0DC; --plum:#8B6FC7;
    --g0:#EDF0EC; --g1:#C7E5CC; --g2:#7CC98F; --g3:#3D9A5C; --shadow:0 10px 30px rgba(15,30,20,.10);
    --shadow-card:0 6px 18px rgba(27,42,33,.06);
  }

  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; justify-content:center}
  #app{width:100%; max-width:430px; min-height:100dvh; display:flex; flex-direction:column; position:relative}

  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  input{font:inherit}

  .screen{flex:1; display:flex; flex-direction:column; padding:14px 18px 90px; gap:10px; overflow-y:auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow-card)}

  /* 정원 히어로 — 시간대별 인사 + 오늘 달성 링 */
  .hero{display:flex; align-items:center; gap:13px; background:linear-gradient(150deg,var(--leaf-050),var(--card));
    border:1px solid var(--line); border-radius:20px; padding:16px 15px 16px 18px; box-shadow:var(--shadow-card)}
  .hero .htxt{flex:1; min-width:0}
  .hero .htxt b{display:block; font-size:16px; font-weight:800; line-height:1.35}
  .hero .htxt span{display:block; font-size:11px; color:var(--sub); margin-top:4px}
  .ring2{width:66px; height:66px; border-radius:50%; position:relative; flex:none}
  .ring2 i{position:absolute; inset:6px; background:var(--card); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-style:normal;
    font-size:13px; font-weight:800; color:var(--leaf-d); font-variant-numeric:tabular-nums}

  .seclbl{display:flex; align-items:center; justify-content:space-between; padding:8px 2px 0}
  .seclbl span{font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--sub)}
  .addchip{background:var(--leaf-050); color:var(--leaf-d); font-size:11.5px; font-weight:700; border-radius:999px; padding:6px 12px}

  /* 상단 바 */
  .appbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 2px}
  .appbar .date{font-size:17px; font-weight:800}
  .appbar .date span{display:block; font-size:11px; color:var(--sub); font-weight:500; margin-top:1px}
  .chips{display:flex; gap:6px; align-items:center}
  .pill{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
  .pill.streak{background:var(--leaf-050); color:var(--leaf-d)}
  .pill.freeze{background:var(--ice-100); color:var(--ice)}

  /* 습관 카드 */
  .habit{display:flex; align-items:center; gap:12px}
  .habit .nm{flex:1; min-width:0}
  .habit .nm b{display:block; font-size:15px; font-weight:700}
  .habit .nm span{font-size:11.5px; color:var(--sub)}
  .habit.done{background:var(--leaf-050); border-color:transparent}
  .habit.done .nm b{color:var(--leaf-d)}
  .leafcnt{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--leaf-d); font-variant-numeric:tabular-nums; flex:none}

  .ck{width:52px; height:52px; border-radius:50%; border:2.5px solid var(--line); flex:none; position:relative; transition:transform .12s}
  .ck:active{transform:scale(.9)}
  .ck.on{background:var(--leaf); border-color:var(--leaf); box-shadow:0 4px 14px rgba(61,154,92,.35)}
  .ck.on::after{content:""; position:absolute; inset:0; background:center/44% no-repeat url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 7"/></svg>')}
  .ck.half{background:linear-gradient(135deg,var(--leaf) 0 50%,transparent 50%); border-color:var(--leaf)}
  .ck.xl{width:92px; height:92px; border-width:3px}

  .minibtn{font-size:11.5px; font-weight:700; color:var(--leaf-d); background:var(--leaf-050); border-radius:999px; padding:5px 10px; flex:none}

  .btn{display:flex; align-items:center; justify-content:center; min-height:50px; border-radius:15px; font-size:15px; font-weight:800; background:var(--leaf); color:#fff; width:100%}
  .btn:active{opacity:.85}
  .btn.sub{background:transparent; border:1.5px solid var(--line); color:var(--ink); font-weight:700}
  .btn.ghost{background:none; color:var(--sub); font-size:13px; font-weight:600; min-height:38px}

  .risk{display:flex; gap:9px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--leaf); border-radius:13px; padding:11px 13px; font-size:13px; line-height:1.45}

  /* 잔디 */
  .grass{display:grid; grid-template-columns:repeat(12,1fr); gap:4px}
  .grass i{aspect-ratio:1; border-radius:4px; background:var(--g0); position:relative}
  .grass i.p{background:var(--g1)} .grass i.d1{background:var(--g2)} .grass i.d2{background:var(--g3)}
  .grass i.fz{background:var(--g1)}
  .grass i.fz::after{content:"❄"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:var(--ice)}
  .grass i.today{outline:2px solid var(--leaf); outline-offset:1px}

  .tiles{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 10px}
  .tile b{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
  .tile span{display:block; font-size:10.5px; color:var(--sub); margin-top:3px}

  /* 탭바 */
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    display:flex; border-top:1px solid var(--line); background:var(--card); padding:8px 8px calc(10px + env(safe-area-inset-bottom)); z-index:20}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--mut); font-weight:600}
  .tab.on{color:var(--leaf-d)}
  .tab svg{width:22px; height:22px}

  /* 시트/모달 */
  .sheet-dim{position:fixed; inset:0; background:rgba(10,18,13,.45); z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheet{width:100%; max-width:430px; background:var(--card); border-radius:22px 22px 0 0; padding:14px 20px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px}
  .sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto}
  .sheet h3{font-size:17px; font-weight:800; text-wrap:balance}
  .sheet p{font-size:13px; color:var(--sub); line-height:1.55}
  .field label{display:block; font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:5px}
  .field input{width:100%; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:11px 12px; font-size:14px}
  .field input:focus{outline:none; border-color:var(--leaf)}

  /* 온보딩 */
  .ob{flex:1; display:flex; flex-direction:column; padding:22px 22px 26px; gap:12px}
  .dots{display:flex; gap:5px; justify-content:center}
  .dots i{width:6px; height:6px; border-radius:3px; background:var(--g0)}
  .dots i.on{background:var(--leaf); width:18px}
  .ob h1{font-size:23px; font-weight:800; line-height:1.35; text-wrap:balance; margin-top:8px}
  .ob .sub{font-size:13.5px; color:var(--sub); line-height:1.6}
  .opt{display:flex; align-items:center; gap:12px; padding:15px 14px; text-align:left; width:100%}
  .opt:active{border-color:var(--leaf)}
  .opt .emo{width:42px; height:42px; border-radius:12px; background:var(--leaf-050);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex:none}
  .opt b{display:block; font-size:15px}
  .opt span{font-size:12px; color:var(--sub)}
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center}
  .sprout{width:96px; height:96px; border-radius:50%; background:var(--leaf-050); display:flex; align-items:center; justify-content:center}
  .spacer{flex:1}

  /* 토스트 */
  #toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    font-size:12.5px; font-weight:600; border-radius:999px; padding:9px 16px; opacity:0; transition:opacity .2s; z-index:50; pointer-events:none; max-width:86%; text-align:center}
  #toast.show{opacity:1}

  /* 데모 시계 */
  #clockbtn{position:fixed; right:max(14px, calc(50% - 215px + 14px)); bottom:96px; z-index:25;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:999px; padding:9px 13px; font-size:12px; font-weight:800; color:var(--leaf-d)}
  .clockpanel{display:flex; flex-direction:column; gap:8px}
  .clockpanel .now{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}
  .clockrow{display:flex; gap:7px; flex-wrap:wrap}
  .clockrow button{background:var(--leaf-050); color:var(--leaf-d); font-size:12px; font-weight:700; border-radius:999px; padding:8px 12px}
  .clockrow button.warn{background:var(--amber-100); color:var(--amber)}

  .listrow{display:flex; justify-content:space-between; align-items:center; padding:12px 2px; font-size:13.5px; border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}
  .listrow .r{color:var(--sub); font-size:12.5px; display:flex; gap:6px; align-items:center}
  .seg{display:flex; background:var(--g0); border-radius:999px; padding:3px}
  .seg button{flex:1; border-radius:999px; padding:5px 10px; font-size:11.5px; font-weight:700; color:var(--sub)}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}

  h4.sec{font-size:12px; color:var(--sub); font-weight:800; letter-spacing:.04em; margin:6px 2px 0}
  .note{font-size:11px; color:var(--mut); line-height:1.55}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   루트(ROOT) 코어 루프 프로토타입 — 06 문서 판정 규칙의 구현 데모
   범위: Phase 0 S1~S2 (매일형 습관 · 04:00 경계 · 프리즈 · 회복 체크)
   ════════════════════════════════════════════════════════════════ */

var LS_KEY = "root-proto-v1";
var FREE_SLOTS = 3, FREEZE_CAP = 2, DAY_MS = 86400000;

/* ── 상태 ── */
var S = load();
function fresh(){
  return {
    ob: { step: "welcome", area: null, time: null, chrono: null, remind: null },
    obDone: false,
    habits: [],            // {id, name, mini, created(local_date), freezeOn}
    checks: {},            // {"YYYY-MM-DD": {habitId: "full"|"partial"}}
    outcomes: {},          // {"YYYY-MM-DD": {habitId: DONE_F|DONE_P|FROZEN|PENDING|RECOVERED|MISSED}}
    freeze: { bal: 1, log: [] },
    recoveryUsedMonth: null,
    lastJudged: null,      // 이 local_date까지 판정 완료
    clockOff: 0,
    theme: "system",
    tab: "home",
    seq: 1
  };
}
function load(){ try{ var d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && d.ob) return d; }catch(e){} return fresh(); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

/* ── 시간: 가상 시계 + 04:00 하루 경계 (06 §2) ── */
function now(){ return new Date(Date.now() + S.clockOff); }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function localDate(d){ return ymd(new Date(d.getTime() - 4*3600000)); }  // 04:00 리셋
function today(){ return localDate(now()); }
function parse(ds){ var p = ds.split("-"); return new Date(+p[0], +p[1]-1, +p[2], 12); }
function addDays(ds, n){ var d = parse(ds); d.setDate(d.getDate()+n); return ymd(d); }
function monthKey(ds){ return ds.slice(0,7); }
function cmp(a,b){ return a < b ? -1 : a > b ? 1 : 0; }

/* ── 판정 엔진: 04:00 배치 (06 §4.2 의사코드 구현) ── */
function judgeUpTo(){
  var t = today();
  if (!S.lastJudged) { S.lastJudged = addDays(t, -1); return; }
  var D = addDays(S.lastJudged, 1);
  while (cmp(D, t) < 0){          // 어제까지의 모든 미판정일을 순서대로
    judgeDay(D);
    S.lastJudged = D;
    D = addDays(D, 1);
  }
  save();
}
function judgeDay(D){
  // 월 전환 → 프리즈 정기 지급 (무료 월 1, 상한 2)
  var prev = addDays(D, -1);
  if (monthKey(D) !== monthKey(prev)){
    if (S.freeze.bal < FREEZE_CAP){ S.freeze.bal++; S.freeze.log.unshift({d:D, t:"grant", m:"매월 1일 지급 +1"}); }
    else S.freeze.log.unshift({d:D, t:"skip", m:"보유 상한(2)으로 지급 소멸"});
  }
  var out = S.outcomes[D] = S.outcomes[D] || {};
  var prevOut = S.outcomes[prev] || {};
  var misses = [];
  S.habits.forEach(function(h){
    if (cmp(h.created, D) > 0) return;                       // 생성 전
    // 전일 PENDING 미회복 → 그 날은 MISSED 확정 (D+1 경계, 06 §4.2)
    if (prevOut[h.id] === "PENDING") prevOut[h.id] = "MISSED";
    var c = (S.checks[D] || {})[h.id];
    if (c === "full") out[h.id] = "DONE_F";
    else if (c === "partial") out[h.id] = "DONE_P";
    else misses.push(h);
  });
  // 스트릭 긴 습관부터 자원 배분 (06 §4.2 정렬)
  misses.sort(function(a,b){ return streakAt(b, D) - streakAt(a, D); });
  var pendingGiven = hasPendingAnywhere();
  misses.forEach(function(h){
    if (h.freezeOn && S.freeze.bal > 0){
      S.freeze.bal--; out[h.id] = "FROZEN";
      S.freeze.log.unshift({d:D, t:"use", m:"「"+h.name+"」을 지켰어요 −1"});
    } else if (S.recoveryUsedMonth !== monthKey(addDays(D,1)) && !pendingGiven){
      out[h.id] = "PENDING"; pendingGiven = true;            // 유저당 월 1회 — 1건만 대기
    } else out[h.id] = "MISSED";
  });
}
function hasPendingAnywhere(){
  for (var d in S.outcomes) for (var id in S.outcomes[d]) if (S.outcomes[d][id] === "PENDING") return true;
  return false;
}
/* 스트릭 = 원장 재계산 (13 §4.3 — 저장 카운터를 믿지 않는다) */
function streakAt(h, D){        // D 전날까지의 체인 + D 당일 체크
  var n = 0, d = addDays(D, -1);
  while (cmp(d, h.created) >= 0){
    var o = (S.outcomes[d] || {})[h.id];
    if (o === "DONE_F" || o === "DONE_P") n++;
    else if (o === "FROZEN" || o === "RECOVERED" || o === "PENDING"){ /* 유지, +1 없음 */ }
    else break;
    d = addDays(d, -1);
  }
  if ((S.checks[D] || {})[h.id]) n++;
  return n;
}
function streak(h){ return streakAt(h, today()); }
function totalStreak(){        // 전체 데일리 스트릭 (06 §4.4)
  var n = 0, d = addDays(today(), -1);
  var first = S.habits.length ? S.habits.map(function(h){return h.created;}).sort()[0] : today();
  while (cmp(d, first) >= 0){
    var any = false, broken = true;
    S.habits.forEach(function(h){
      if (cmp(h.created, d) > 0) return;
      var o = (S.outcomes[d] || {})[h.id];
      if (o === "DONE_F" || o === "DONE_P"){ any = true; broken = false; }
      else if (o === "FROZEN" || o === "RECOVERED" || o === "PENDING") broken = false;
    });
    if (any) n++;
    else if (broken) break;
    d = addDays(d, -1);
  }
  var t = S.checks[today()] || {};
  for (var k in t){ n++; break; }
  return n;
}

/* ── 체크인 ── */
function pendingFor(h){ return (S.outcomes[addDays(today(),-1)] || {})[h.id] === "PENDING"; }
function doCheck(h, grade){
  var t = today();
  S.checks[t] = S.checks[t] || {};
  var cur = S.checks[t][h.id];
  if (cur === "full" && grade === "full"){                    // 언체크 (당일·앱에서만, 06 §3)
    delete S.checks[t][h.id]; save(); render(); toast("체크를 취소했어요"); return;
  }
  if (cur === "partial" && grade === "full"){                 // 부분→완전 승격 (06 §5)
    S.checks[t][h.id] = "full"; save(); render(); toast("완전 달성으로 승격!"); return;
  }
  S.checks[t][h.id] = grade;
  save();
  if (pendingFor(h)){ openRecoverySheet(h); return; }         // 회복 체크 카드 (06 §4.2)
  render();
  toast(grade === "partial" ? "2분 버전도 훌륭해요 — 오늘로 인정!" : streak(h) + "일째 — 오늘도 자랐어요 🌱");
}
function openRecoverySheet(h){
  render();
  sheet(
    '<h3>어제는 사고였어요.<br>스트릭 이어갈까요?</h3>' +
    '<p>「' + esc(h.name) + '」 — 이번 달 회복 체크 1회를 쓰면 어제까지의 기록이 그대로 이어져요. 미스 한 번은 사고, 두 번부터가 진짜 끊김이에요.</p>' +
    '<button class="btn" onclick="acceptRecovery(\'' + h.id + '\')">스트릭 이어가기</button>' +
    '<button class="btn ghost" onclick="declineRecovery(\'' + h.id + '\')">괜찮아요, 새로 시작할게요</button>'
  );
}
function acceptRecovery(id){
  var y = addDays(today(), -1);
  if ((S.outcomes[y]||{})[id] === "PENDING"){
    S.outcomes[y][id] = "RECOVERED";
    S.recoveryUsedMonth = monthKey(today());
  }
  closeSheet(); save(); render(); toast("이어졌어요 — 어제는 없던 일로 🌿");
}
function declineRecovery(id){
  var y = addDays(today(), -1);
  if ((S.outcomes[y]||{})[id] === "PENDING") S.outcomes[y][id] = "MISSED";
  closeSheet(); save(); render(); toast("새 마음으로 1일차부터!");
}

/* 홈 */
function viewHome(){
  var t = today(), n = now(), hour = new Date(n.getTime()).getHours();
  var checks = S.checks[t] || {};
  var due = S.habits.slice();
  var doneAll = due.length > 0 && due.every(function(h){ return checks[h.id]; });
  var undone = due.filter(function(h){ return !checks[h.id]; });

  var head =
    '<div class="appbar"><div class="date">' + fmtK(t) + '<span>' + weekday(t) + (hour >= 21 ? " 밤" : "") + '</span></div>' +
    '<div class="chips"><span class="pill streak">' + leafSvg("#2E7D4A") + totalStreak() + '</span>' +
    '<span class="pill freeze">❄ ' + S.freeze.bal + '</span></div></div>';

  var body = '<div class="screen">';

  // 정원 히어로 — 시간대별 인사 + 오늘 달성 링
  var doneN = due.length - undone.length;
  var deg = due.length ? Math.round(doneN / due.length * 360) : 0;
  var greet = doneAll && due.length ? "오늘 몫을 전부 해냈어요 🌿"
    : (hour >= 4 && hour < 11) ? "좋은 아침이에요"
    : (hour >= 11 && hour < 17) ? "오늘도 한 걸음씩"
    : (hour >= 17 && hour < 21) ? "저녁 정원에 물 줄 시간"
    : "자기 전, 2분이면 충분해요";
  var heroSub = !due.length ? "첫 습관을 심어볼까요?"
    : doneAll ? "내일 첫 습관: 「" + esc(due[0].name) + "」"
    : "오늘 " + due.length + "개 중 " + doneN + "개 완료";
  body += '<div class="hero"><div class="htxt"><b>' + greet + '</b><span>' + heroSub + '</span></div>' +
    '<div class="ring2" style="background:conic-gradient(var(--leaf) 0 ' + deg + 'deg, var(--g0) ' + deg + 'deg 360deg)">' +
    '<i>' + (doneAll && due.length ? "✓" : doneN + "/" + due.length) + '</i></div></div>';

  if (hour >= 21 && undone.length)
    body += '<div class="risk">' + leafSvg("var(--leaf)", 16) +
      '<span>오늘 <b>' + (streak(undone[0]) + 1) + '일째</b>가 될 수 있어요. 2분이면 지킬 수 있어요.</span></div>';

  body += '<div class="seclbl"><span>오늘의 습관</span>' +
    (due.length < FREE_SLOTS ? '<button class="addchip" onclick="openAdd()">＋ 추가</button>' : '') + '</div>';

  // 미완료 우선 정렬 (11 §3.1)
  var sorted = due.slice().sort(function(a,b){ return (checks[a.id]?1:0) - (checks[b.id]?1:0); });
  sorted.forEach(function(h){
    var c = checks[h.id];
    var st = streak(h);
    var subtxt = c === "full" ? "완료 · 오늘도 해냈어요"
               : c === "partial" ? "부분 달성 — 오늘로 똑같이 인정돼요"
               : pendingFor(h) ? "지금 하면 어제까지 이어져요"
               : "2분 버전: " + esc(h.mini);
    body += '<div class="card habit' + (c ? " done" : "") + '">' +
      '<button class="ck ' + (c === "full" ? "on" : c === "partial" ? "half" : "") + '" aria-label="' + esc(h.name) + ' 체크" onclick="tapCheck(\'' + h.id + '\')"></button>' +
      '<div class="nm"><b>' + esc(h.name) + '</b><span>' + subtxt + '</span></div>' +
      (!c ? '<button class="minibtn" onclick="doCheckId(\'' + h.id + '\',\'partial\')">2분만</button>' : "") +
      '<span class="leafcnt">' + leafSvg("var(--leaf-d)") + st + '</span></div>';
  });

  if (!due.length)
    body += '<div class="card" style="text-align:center; padding:28px 14px">' +
      '<div style="width:64px;height:64px;border-radius:50%;background:var(--leaf-050);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">' +
      leafSvg("var(--leaf)", 28) + '</div>' +
      '<b style="font-size:14px">아직 심은 습관이 없어요</b>' +
      '<p class="note" style="margin:4px 0 14px">2분짜리 하나면 충분해요</p>' +
      '<button class="btn" style="max-width:190px;margin:0 auto" onclick="openAdd()">습관 심기</button></div>';
  else if (due.length >= FREE_SLOTS)
    body += '<p class="note" style="text-align:center">무료 슬롯 3개를 모두 쓰고 있어요 — 4번째부터는 곧 열릴 예정이에요.</p>';
  body += "</div>";
  return head + body;
}
function tapCheck(id){ var h = byId(id); doCheck(h, "full"); }
function doCheckId(id, g){ var h = byId(id); doCheck(h, g); }
function byId(id){ return S.habits.filter(function(h){ return h.id === id; })[0]; }

/* 기록 */
function viewLog(){
  var t = today();
  var cells = "", start = addDays(t, -83);
  for (var i = 0; i < 84; i++){
    var d = addDays(start, i);
    var cls = grassClass(d);
    cells += "<i" + (cls || d === t ? ' class="' + cls + (d === t ? " today" : "") + '"' : "") + "></i>";
  }
  // 이번 주(월 04:00 시작) 달성률
  var wd = (parse(t).getDay() + 6) % 7;   // 월=0
  var wkStart = addDays(t, -wd), doneN = 0, dueN = 0;
  for (var j = 0; j <= wd; j++){
    var dd = addDays(wkStart, j);
    S.habits.forEach(function(h){
      if (cmp(h.created, dd) > 0) return;
      dueN++;
      var o = (S.outcomes[dd] || {})[h.id], c = (S.checks[dd] || {})[h.id];
      if (o === "DONE_F" || o === "DONE_P" || c) doneN++;
    });
  }
  var best = 0; S.habits.forEach(function(h){ best = Math.max(best, streak(h)); });
  var fz = S.freeze.log.filter(function(l){ return l.t === "use" && monthKey(l.d) === monthKey(t); }).length;

  return '<div class="appbar"><div class="date">기록<span>지난 12주</span></div></div><div class="screen">' +
    '<div class="card"><div class="grass">' + cells + '</div>' +
    '<p class="note" style="margin-top:9px">미달성일은 빈 칸이에요 — 그날의 달성만 기록해요.</p></div>' +
    '<div class="tiles">' +
    '<div class="tile">' + leafSvg("var(--leaf)", 14) + '<b style="display:block;margin-top:7px">' + (dueN ? Math.round(doneN/dueN*100) : 0) + '%</b><span>이번 주 달성률</span></div>' +
    '<div class="tile">' + leafSvg("var(--leaf-d)", 14) + '<b style="display:block;margin-top:7px">' + best + '일</b><span>최장 스트릭</span></div>' +
    '<div class="tile"><span style="font-size:13px;color:var(--ice)">❄</span><b style="display:block;margin-top:7px">' + fz + '회</b><span>프리즈가 지킴</span></div></div>' +
    '<h4 class="sec">프리즈 기록</h4><div class="card">' +
    (S.freeze.log.length ? S.freeze.log.slice(0,6).map(function(l){
      return '<div class="listrow"><span>' + fmtK(l.d) + '</span><span class="r">' + esc(l.m) + '</span></div>';
    }).join("") : '<p class="note">아직 기록이 없어요 — 프리즈는 놓친 날 자동으로 스트릭을 지켜요.</p>') +
    '</div></div>';
}
function grassClass(d){
  var out = S.outcomes[d] || {}, ck = S.checks[d] || {};
  var due = 0, done = 0, part = 0, froz = 0;
  S.habits.forEach(function(h){
    if (cmp(h.created, d) > 0) return;
    due++;
    var o = out[h.id];
    if (o === "DONE_F" || (!o && ck[h.id] === "full")) done++;
    else if (o === "DONE_P" || o === "RECOVERED" || (!o && ck[h.id] === "partial")) part++;
    else if (o === "FROZEN") froz++;
  });
  if (!due) return "";
  if (done === due) return "d2";
  if (done + part === due && done > 0) return "d1";
  if (done + part > 0) return "p";
  if (froz > 0) return "fz";
  return "";
}

    html = '<div class="ob"><div class="stage"><div class="sprout">' + leafSvg("var(--leaf)", 44) + '</div>' +
      (starter
        ? '<h1>본 게임은 내일이에요.<br>오늘은 몸풀기!</h1><p class="sub">「' + STARTERS[o.area] + '」 어때요?<br>스트릭과는 무관한 몸풀기 미션이에요.</p>'
        : '<h1>지금 바로 해볼까요?</h1><p class="sub">「' + esc(S.habits[0].mini) + '」 — 딱 2분이면 돼요.<br>지금 체크하면 오늘부터 스트릭 1일!</p>') +
      '</div><button class="btn" onclick="obFirstCheck(' + (starter ? "true" : "false") + ')">했어요!</button>' +
      '<button class="btn ghost" onclick="ob(\'remind\')">나중에 할게요</button></div>';
  }

  else if (o.step === "remind"){
    var def = o.chrono === "아침형" ? "07:00" : o.chrono === "저녁형" ? "20:30" : "12:30";
    html = '<div class="ob"><h1>내일 몇 시에 알려드릴까요?</h1><p class="sub">잔소리는 안 해요 — 습관 시간에 딱 한 번만.</p>' +
      '<div class="clockrow" style="margin-top:4px">' + ["07:00","12:30","20:30"].map(function(tm){
        return '<button style="' + (tm === def ? "outline:2px solid var(--leaf)" : "") + '" onclick="obRemind(\'' + tm + '\')">' + tm + '</button>';
      }).join("") + '</div>' +
      '<div class="spacer"></div><button class="btn ghost" onclick="obRemind(null)">알림 없이 할게요</button></div>';
  }

  else if (o.step === "landing"){
    html = '<div class="ob"><div class="stage"><div class="sprout">' + leafSvg("var(--leaf)", 44) + '</div>' +
      '<h1>여기가 당신의 정원이에요.</h1><p class="sub">' + (o.remind ? "내일 " + o.remind + "에 만나요." : "내일 또 만나요.") + '</p></div>' +
      '<button class="btn" onclick="obDone()">정원 입장</button></div>';
  }
  app.innerHTML = html;
}
function ob(step){ S.ob.step = step; save(); render(); }
function obSet(k, v, next){ S.ob[k] = v; S.ob.step = next; save(); render(); }
function obPick(useMini){
  var r = pickRoutine();
  S.habits.push({ id: "h" + (S.seq++), name: useMini ? r.m : r.h, mini: r.m, created: today(), freezeOn: true });
  S.ob.step = "first"; save(); render();
}
function obFirstCheck(isStarter){
  if (!isStarter){
    var t = today(); S.checks[t] = S.checks[t] || {};
    S.checks[t][S.habits[0].id] = "full";
    toast("첫 체크 완료! 내일이면 2일째예요");
  } else toast("몸풀기 완료 — 내일, 진짜 첫 스트릭이 시작돼요");
  S.ob.step = "remind"; save(); render();
}
function obRemind(tm){ S.ob.remind = tm; S.ob.step = "landing"; save(); render(); }
function obDone(){ S.obDone = true; S.lastJudged = addDays(today(), -1); S.tab = "home"; save(); render(); }

/* ── 습관 추가 시트 ── */
function openAdd(){
  sheet('<h3>새 습관</h3>' +
    '<div class="field"><label>습관 이름</label><input id="f-name" placeholder="예: 홈트 15분" maxlength="20"></div>' +
    '<div class="field"><label>2분 버전 (필수) — 처음 목표는 작을수록 이겨요</label><input id="f-mini" placeholder="예: 운동복 갈아입기" maxlength="20"></div>' +
    '<button class="btn" onclick="addHabit()">추가하기</button>');
}
function addHabit(){
  var n = document.getElementById("f-name").value.trim();
  var m = document.getElementById("f-mini").value.trim();
  if (!n){ toast("습관 이름을 적어주세요"); return; }
  if (!m){ toast("2분 버전이 꼭 필요해요 — 작게 시작해요"); return; }
  if (S.habits.length >= FREE_SLOTS){ toast("무료 슬롯 3개를 모두 쓰고 있어요"); return; }
  S.habits.push({ id: "h" + (S.seq++), name: n, mini: m, created: today(), freezeOn: true });
  closeSheet(); save(); render(); toast("「" + n + "」 시작 — 오늘부터 1일차예요");
}

/* ── 데모 시계 ── */
function openClock(){
  var n = now();
  sheet('<div class="clockpanel"><h3>🕐 데모 시계</h3>' +
    '<div class="now">' + fmtK(today()) + " " + String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0") +
    ' <span style="font-size:11px; color:var(--sub); font-weight:600">(하루 경계 04:00)</span></div>' +
    '<div class="clockrow">' +
    '<button onclick="jump(3600000)">+1시간</button>' +
    '<button onclick="jumpTo(21)">밤 9시로</button>' +
    '<button onclick="jumpNextMorning()">다음 날 아침</button>' +
    '<button onclick="jumpDays(3)">3일 뒤</button>' +
    '<button class="warn" onclick="clockReset()">시계 초기화</button></div>' +
    '<p class="note">시간을 넘기면 04:00 배치가 실행돼요 — 놓친 날의 프리즈 소모·회복 대기·끊김이 06 문서 규칙대로 판정됩니다.</p></div>');
}
function jump(ms){ S.clockOff += ms; save(); closeSheet(); render(); openClock(); }
function jumpTo(hh){
  var n = now(); var target = new Date(n); target.setHours(hh, 0, 0, 0);
  if (target <= n) target.setDate(target.getDate() + 1);
  S.clockOff += (target - n); save(); closeSheet(); render(); openClock();
}
function jumpNextMorning(){
  var n = now(); var target = new Date(n); target.setDate(target.getDate() + (n.getHours() >= 4 ? 1 : 0)); target.setHours(9, 0, 0, 0);
  if (target <= n) target.setDate(target.getDate() + 1);
  S.clockOff += (target - n); save(); closeSheet(); render();
  toast(fmtK(today()) + " 아침이에요");
}
function jumpDays(d){ S.clockOff += d * DAY_MS; save(); closeSheet(); render(); toast(fmtK(today()) + " — " + d + "일이 지났어요"); }
function clockReset(){ S.clockOff = 0; save(); closeSheet(); render(); }

/* ── 공용 UI ── */
var sheetEl = null;
function sheet(inner){
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "sheet-dim";
  sheetEl.innerHTML = '<div class="sheet"><div class="grab"></div>' + inner + "</div>";
  sheetEl.addEventListener("click", function(e){ if (e.target === sheetEl) closeSheet(); });
  document.body.appendChild(sheetEl);
}
function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; } }
var toastT = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function leafSvg(color, size){
  size = size || 11;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '" style="flex:none"><path d="M12 2C7 7 4 11 4 15a8 8 0 0 0 16 0c0-4-3-8-8-13Z"/></svg>';
}
function fmtK(ds){ var p = ds.split("-"); return (+p[1]) + "월 " + (+p[2]) + "일"; }
function weekday(ds){ return ["일","월","화","수","목","금","토"][parse(ds).getDay()] + "요일"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

render();
</script>
